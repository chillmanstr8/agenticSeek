name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint:
    name: Pre-commit checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install pre-commit
        run: pip install pre-commit

      - name: Run pre-commit hooks
        run: pre-commit run --all-files

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install test dependencies
        run: |
          pip install --upgrade pip
          pip install pytest pytest-timeout
          pip install requests python-dotenv colorama termcolor

      - name: Run unit tests
        run: pytest tests/ -v --timeout=30 --ignore=tests/test_browser_agent_parsing.py --ignore=tests/test_chromedriver_update.py
        env:
          SEARXNG_BASE_URL: "http://localhost:8080"
