name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  lint:
    name: Pre-commit checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install pre-commit
        run: pip install pre-commit

      - name: Install TruffleHog
        env:
          TRUFFLEHOG_VERSION: "3.96.0"
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -sSfL "https://github.com/trufflesecurity/trufflehog/releases/download/v${TRUFFLEHOG_VERSION}/trufflehog_${TRUFFLEHOG_VERSION}_linux_amd64.tar.gz" -o /tmp/trufflehog.tar.gz
          tar -xzf /tmp/trufflehog.tar.gz -C /tmp trufflehog
          install -m 0755 /tmp/trufflehog "$HOME/.local/bin/trufflehog"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Run pre-commit hooks
        run: pre-commit run --all-files

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install test dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements-ci.txt

      - name: Run unit tests
        run: pytest tests/ -v --timeout=30 --ignore=tests/test_browser_agent_parsing.py --ignore=tests/test_chromedriver_update.py --ignore=tests/test_memory.py
        env:
          SEARXNG_BASE_URL: "http://localhost:8080"
